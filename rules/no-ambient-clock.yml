id: no-ambient-clock
language: Tsx
severity: error
message: "No `new Date()` / `Date.now()` in domain code: the clock is injected (`now: Date` parameter or a `Clock`), so the rule is testable."
rule:
  any:
    - pattern: new Date()
    - pattern: Date.now()
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
ignores:
  - "**/node_modules/**"
  - "**/*.test.ts"
  - "**/__tests__/**"
  - "**/tests/**"
  - "**/*.test.tsx"
